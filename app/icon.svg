<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy rounded background -->
  <rect width="32" height="32" rx="7" fill="#1B1F32"/>
  <!-- Plug icon — translated to center the 20x20 path in 32x32 -->
  <g transform="translate(6, 6)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left prong -->
    <rect x="7" y="2" width="2" height="4" rx="1" fill="white" stroke="none"/>
    <!-- Right prong -->
    <rect x="11" y="2" width="2" height="4" rx="1" fill="white" stroke="none"/>
    <!-- Plug body -->
    <path d="M5 6h10v4.5a5 5 0 01-10 0V6z" fill="white" stroke="none"/>
    <!-- Stem -->
    <line x1="10" y1="15.5" x2="10" y2="19"/>
    <!-- Foot -->
    <line x1="7.5" y1="19" x2="12.5" y2="19"/>
  </g>
</svg>
